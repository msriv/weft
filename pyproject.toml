[project]
name = "weft"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-pubsub>=2.43.0",
    "google-cloud-storage>=3.17.1",
    "google-cloud-tasks>=2.26.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "neo4j>=5.26",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
ml = [
    "fasttext-wheel>=0.9.2",
    "sentence-transformers>=3.0.0",
    "spacy>=3.8.0",
    "transformers>=4.50.0",
    "torch>=2.15.0",
]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "types-pyyaml>=6.0.12.20261103",
    "types-jsonschema>=4.26.0.20261006",
]

# CPU-only torch on Linux: we never run on GPUs, and the default wheels pull ~3 GB of CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weft_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
files = ["weft_core", "services", "pipeline", "evals", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["feedparser", "google.protobuf", "google.protobuf.*", "google.cloud.tasks_v2", "pytesseract", "pyarrow", "pyarrow.*", "google.cloud.*", "sentence_transformers", "spacy", "transformers", "fasttext"]
ignore_missing_imports = true
