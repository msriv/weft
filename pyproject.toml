[project]
name = "weft"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "google-cloud-pubsub>=2.43.0",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "types-pyyaml>=6.0.12.20261103",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weft_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
files = ["weft_core", "services", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["feedparser", "google.cloud.*"]
ignore_missing_imports = true
