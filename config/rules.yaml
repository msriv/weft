# Anomaly rule thresholds. Published on How we weigh.
# Bump `version` on any change; every anomaly records the version that fired it.
# These are starting points, to tune against an editor-labelled set before launch.
version: 5  # 2026-11-13: figure intervals, figure_revised, anonymous_sourcing, single_origin,
# conflicting_accounts (#99, #101, #102, #103)
# version 4: origins and a hypergeometric baseline for omission (#98, #100)
# version 3: anomaly ids per perspective/edit; promotion gate from owner labels

# A rule fires as active (and may notify) only after owner labels on its anomalies reach these;
# until then everything it finds is provisional (#114). Labels never decide a single anomaly.
promotion:
  enabled: true
  min_labels: 20
  min_useful_share: 0.70

provisional:
  min_sources: 5
  min_perspectives: 2
  min_hours_since_first_report: 6

rules:
  omission:
    enabled: true
    min_share_of_event_reports: 0.60   # claim group in >= 60% of independent texts (origins)
    min_perspective_origins: 3         # the silent perspective has >= 3 independent texts
    min_perspective_sources: 2         # from >= 2 outlets
    max_p_value: 0.05                  # hypergeometric P(none of them carry it by chance)
    exclude_paywalled_sources: true
  numbers_differ:
    enabled: true
    min_log_ratio: 0.22                # ln(52/40) = 0.26 fires; hedged intervals that overlap never do
    max_hours_apart: 6                 # tolls rise: only compare reports published close together
  figure_revised:
    enabled: true                      # same outlet, later report, value outside the first one's interval
  anonymous_sourcing:
    enabled: true
    min_named_origins: 2               # independent texts that name who said it
    min_anonymous_origins: 1           # and at least one citing only unnamed sources
  single_origin:
    enabled: true
    min_origins: 4                     # carried by this many independent texts
    min_share: 0.80                    # and this share of them attribute it to one speaker
  conflicting_accounts:
    enabled: true                      # provisional until owner labels pass the promotion gate
    min_origins_per_side: 2
  silence:
    enabled: true
    outlet_quiet_hours: 48
    story_coverage_within: 0.50       # story's coverage stays within 50% of prior window
    min_prior_reports: 10             # story needs this many reports in the prior window
    min_outlet_reports: 3             # the outlet needs this many reports in the prior window
    skip_unhealthy_feeds: true
  copied_text:
    enabled: true
    min_outlets: 3
    min_jaccard: 0.80
    shingle_words: 5
    window_hours: 12
    require_different_owners: true
    ignore_credited_wire_copy: true
  silent_edit:
    enabled: true
    refetch_after: ["1h", "24h", "7d"]
  loaded_wording:        # v2
    enabled: false
    min_weighted_log_odds: 3.0
    exclude_paywalled_sources: true
  unattributed:          # v2
    enabled: false
    min_attributed_versions: 2

# Source weight (nightly stage 9). Changes ordering only; no report is ever hidden (rule 6).
# Never scored on whether an outlet was "right". Each factor is a share between 0 and 1;
# factors that raise the weight count as is, factors that lower it count as (1 - share).
weights:
  window_days: 30
  min_reports: 10                    # fewer reports than this: neutral weight, marked insufficient data
  neutral: 0.5
  type_multiplier: {news: 1.0, wire: 1.0, gov: 1.0, parliament: 1.0, court: 1.0, intl_body: 1.0, blog: 0.8}
  raises: [names_sources, links_documents, corrects_openly]
  lowers: [silent_edits, copied_wording, opinion_share]
