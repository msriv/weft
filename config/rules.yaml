# Anomaly rule thresholds. Published on How we weigh.
# Bump `version` on any change; every anomaly records the version that fired it.
# These are starting points, to tune against an editor-labelled set before launch.
version: 2  # 2026-11-12: numbers within claim group, silence floor, narrower silent edit

provisional:
  min_sources: 5
  min_perspectives: 2
  min_hours_since_first_report: 6

rules:
  omission:
    enabled: true
    min_share_of_event_reports: 0.60   # claim group present in >= 60% of reports
    absent_from_whole_perspective: true
    exclude_paywalled_sources: true
  numbers_differ:
    enabled: true
    min_relative_difference: 0.20
  silence:
    enabled: true
    outlet_quiet_hours: 48
    story_coverage_within: 0.50       # story's coverage stays within 50% of prior window
    min_prior_reports: 10             # story needs this many reports in the prior window
    min_outlet_reports: 3             # the outlet needs this many reports in the prior window
    skip_unhealthy_feeds: true
  copied_text:
    enabled: true
    min_outlets: 3
    min_jaccard: 0.80
    shingle_words: 5
    window_hours: 12
    require_different_owners: true
    ignore_credited_wire_copy: true
  silent_edit:
    enabled: true
    refetch_after: ["1h", "24h", "7d"]
  loaded_wording:        # v2
    enabled: false
    min_weighted_log_odds: 3.0
    exclude_paywalled_sources: true
  unattributed:          # v2
    enabled: false
    min_attributed_versions: 2

# Source weight (nightly stage 9). Changes ordering only; no report is ever hidden (rule 6).
# Never scored on whether an outlet was "right". Each factor is a share between 0 and 1;
# factors that raise the weight count as is, factors that lower it count as (1 - share).
weights:
  window_days: 30
  min_reports: 10                    # fewer reports than this: neutral weight, marked insufficient data
  neutral: 0.5
  type_multiplier: {news: 1.0, wire: 1.0, gov: 1.0, parliament: 1.0, court: 1.0, intl_body: 1.0, blog: 0.8}
  raises: [names_sources, links_documents, corrects_openly]
  lowers: [silent_edits, copied_wording, opinion_share]
