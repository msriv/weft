# Pipeline thresholds. Starting points, to tune against the labelled set in evals/.
version: 1

stream:
  candidate_window_hours: 72     # open events considered for attach
  candidate_limit: 20
  attach_threshold: 0.55         # score = w_cos*cos + w_ent*entity_jaccard + w_time*time_proximity
  weights: {cosine: 0.60, entities: 0.25, time: 0.15}
  time_decay_hours: 24           # from the event's last report (#104)
  member_events: 5               # re-score only the best 5 candidates against member reports
  member_cap: 6                  # newest member embeddings read per event
  cache_ttl_seconds: 60          # sources, beats, profiles and story IDF held in process
  member_top_k: 3                # also score against the 3 nearest member reports
  veto_min_reports: 20           # entity veto once the story has this many reports in 30 days
  near_dup_jaccard: 0.80
  near_dup_window_hours: 72
  event_inplace_minutes: 10      # an attach within this long of the event's last write updates it in place (#151)

# Spend limits per UTC day across all services (#157). Each caller gets its share, so the
# public /v1/ask can never use up the pipeline's tokens and the reverse. A refused call degrades
# the stage (fewer checks); it never fails the run. Tune against the OpenRouter bill.
model_budget:
  daily_tokens: 4000000
  daily_cost_usd: 4.0
  shares: {pipeline: 0.70, stream: 0.15, ask: 0.15}

# Public API limits (#158). Per client (browser address, or user id when signed in), per instance.
limits:
  ask: {per_minute: 5, per_day: 60}
  problem: {per_minute: 3, per_day: 20}
  subscription: {per_minute: 3, per_day: 10}
  auth: {per_minute: 10, per_day: 200}          # web sign-up/sign-in proxy
  streams: {per_client: 3, total: 100}          # open /stories/{id}/stream connections
  max_body_bytes: 20000




# Poller prefilter (#163): feed entries whose title and summary match no beat are not fetched.
# A small random sample still flows, so the admin "unplaced" view sees what the beats miss.
prefilter:
  enabled: true
  sample_rate: 0.02

# Fetching untrusted URLs (#164).
fetch:
  max_html_bytes: 10000000         # pages, feeds, sitemaps, robots.txt
  max_pdf_bytes: 50000000
  max_redirects: 5
  deadline_seconds: 60             # total per request, not per read
  max_pdf_pages: 100               # pages read for text (OCR has its own cap)

# Source yield, cadence, dormancy and ceilings (#171).
sources:
  window_days: 14
  dormant_days: 30                # no on-beat report in this long: dormant (not polled)
  low_yield: 0.05                 # below this on-beat share a source is polled every low_every-th run
  low_every: 6
  run_seconds: 600                # the poller schedule
  max_per_beat: 40                # active sources found by discovery, per beat
  max_total: 150

# Extraction quality gate (#170): pages that are not articles are not stored as reports.
quality:
  min_chars: 300
  min_sentences: 3                # a short news brief of 3 sentences passes
  stub_share: 0.5                 # share of sentences that are stub text
  boilerplate_urls: 3             # same text from one source under this many URLs: boilerplate
  paywall_share: 0.5              # share of a source's items in 7 days that are stubs ...
  paywall_min_items: 20           # ... once it has this many: flag the source as paywalled
  stub_patterns:
    en:
      - subscribe (now )?to (continue|read|keep)
      - sign in to (read|continue|view)
      - log in to (read|continue|view)
      - already a subscriber
      - (enable|turn on) javascript
      - javascript (is )?(required|disabled)
      - verify (that )?you are (a )?human
      - are you a robot
      - (we use|this site uses) cookies
      - accept (all )?cookies
      - (page|article) (was )?not found
      - this content is (only )?available to subscribers

nightly:
  regroup_days: 14
  split_days: 3                  # re-cluster this many days from scratch; older events frozen (#105)
  split_max_gap_hours: 48        # two reports further apart never share an event in the split
  split_check_band: 0.05         # average-link merges this close to the cut go to merge_check
  thread_entity_cosine: 0.50     # FOLLOWS: entity overlap at least this (#109)
  thread_centroid_band: [0.35, 0.55]  # and text similarity in this band (below attach)
  thread_max_gap_days: 14
  merge_min_score: 0.45          # below this a pair is never a candidate
  merge_auto_score: 0.80         # at or above this, merge without asking the model
  claim_group_cosine: 0.90       # claim contents this close say the same thing (#110)
  claim_candidate_cosine: 0.65   # closer than this: same thing if they entail each other both ways
  claim_entailment: 0.70         # NLI entailment needed in each direction
  conflict_min_cosine: 0.50      # only topically close claim groups go to NLI
  nli_contradiction: 0.80        # NLI probability to record a conflict
  token_budget_per_beat: 400000  # stages degrade (fewer merge checks) rather than overspend
  token_shares: {regroup: 0.2, claims: 0.6, detective: 0.2}  # of the beat budget, per stage
  review_sample_rate: 0.01

# Nightly stage order: the single source of truth. pipeline/run.py runs them in this order and
# Terraform (infra/modules/nightly) builds the Cloud Workflow from it (#156). `needs` lists
# stages whose failure makes this one skip; every other stage still runs after a failure.
# tests/test_stage_list.py guards the names against pipeline/run.py STAGES.
stages:
  - {name: regroup, needs: []}
  - {name: threads, needs: [regroup]}
  - {name: origins, needs: [regroup]}
  - {name: claims, needs: [regroup]}
  - {name: figures, needs: [claims]}
  - {name: claim_groups, needs: [claims]}
  - {name: conflicts, needs: [claim_groups]}
  - {name: short_version, needs: [regroup]}
  - {name: statements, needs: [claims]}
  - {name: links, needs: [regroup]}
  - {name: anomalies, needs: [origins, figures, conflicts, statements, links]}
  - {name: weights, needs: []}
  - {name: detective, needs: [claims, anomalies]}
  - {name: series, needs: []}
  - {name: domains, needs: []}
  - {name: directions, needs: [series, domains]}
  - {name: snapshot, needs: []}
  - {name: profiles, needs: []}
  - {name: review_sample, needs: []}
  - {name: notify, needs: []}
