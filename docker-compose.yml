# Local stack. Neo4j (graph), fake-gcs-server for GCS, bigquery-emulator for BigQuery,
# Pub/Sub emulator, Cloud Tasks emulator, Firebase Auth + Firestore emulators.
# `docker compose up` starts everything, including the scheduled jobs.

x-env: &env
  PROJECT_ID: weft-local
  REGION: local
  RAW_BUCKET: weft-raw
  STATE_BUCKET: weft-state
  SNAPSHOT_BUCKET: weft-snapshots
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-weft-local-pw}
  STORAGE_EMULATOR_HOST: http://gcs:4443
  PUBSUB_EMULATOR_HOST: pubsub:8085
  BIGQUERY_EMULATOR_HOST: http://bigquery:9050
  TASKS_EMULATOR_HOST: tasks:8123
  REFETCH_QUEUE: refetch
  TASKS_SERVICE_ACCOUNT: local@weft-local.iam.gserviceaccount.com
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  PYTHONUNBUFFERED: "1"  # print() shows in `docker compose logs` straight away
  HF_TOKEN: ${HF_TOKEN:-}  # optional; huggingface_hub reads it for faster model downloads
  MODEL_BASE_URL: ${MODEL_BASE_URL:-https://openrouter.ai/api/v1}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_REVISION: ${MODEL_REVISION:-}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  SITE_URL: http://localhost:3000
  DETECTIVE: ${DETECTIVE:-on}  # D20 speculation panel; never set in production Terraform
  FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
  FIRESTORE_EMULATOR_HOST: firebase:8080

x-deps: &deps
  neo4j: { condition: service_healthy }
  init: { condition: service_completed_successfully }

# Ready = the FastAPI app answers (stream-worker loads its models before it does).
x-ready: &ready
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/openapi.json')"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 15m  # first start downloads the Hugging Face models

x-job: &job
  entrypoint: ["sh", "-c", "sleep $$DELAY; while true; do uv run --no-sync $$JOB || echo job failed; sleep $$EVERY; done"]
  # Nothing is published until the push targets are up, so Pub/Sub never pushes into a dead port.
  depends_on:
    seed: { condition: service_completed_successfully }
    fetcher: { condition: service_healthy }
    stream-worker: { condition: service_healthy }
  restart: unless-stopped

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-weft-local-pw}
    volumes: ["neo4j:/data"]
    ports: ["7474:7474", "7687:7687"]  # Neo4j Browser at http://localhost:7474
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-weft-local-pw}", "RETURN 1"]
      interval: 5s
      retries: 30
  gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory"]
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=weft-local", "--dataset=weft"]
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085"]
  firebase:  # Firebase Auth + Firestore emulators (reader accounts and preferences)
    build: ./local/firebase
  tasks:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    command: ["-host", "0.0.0.0", "-port", "8123", "-initial-queue", "projects/weft-local/locations/local/queues/refetch"]

  init:
    build: { context: ., dockerfile: services/api/Dockerfile }
    command: ["uv", "run", "--no-sync", "python", "/local/init.py"]
    environment: { <<: *env, PYTHONPATH: /app }
    volumes: ["./local:/local:ro", "./infra/modules/bigquery/schemas:/app/infra/modules/bigquery/schemas:ro"]
    depends_on: [gcs, bigquery, pubsub, tasks]
    restart: "no"

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    restart: unless-stopped  # like Cloud Run: a crashed service comes back
    environment: *env  # WEFT_NLP=real comes from the image, as in the pipeline
    depends_on: { <<: *deps, firebase: { condition: service_started } }
    ports: ["8080:8080"]
  fetcher:
    build: { context: ., dockerfile: services/fetcher/Dockerfile }
    restart: unless-stopped  # like Cloud Run: a crashed service comes back
    environment: *env
    depends_on: *deps
    healthcheck: *ready
  stream-worker:
    build: { context: ., dockerfile: services/stream_worker/Dockerfile }
    restart: unless-stopped  # like Cloud Run: a crashed service comes back
    environment: *env
    depends_on: *deps
    healthcheck: *ready
  web:
    build: ./web
    restart: unless-stopped  # like Cloud Run: a crashed service comes back
    environment:
      API_URL: http://api:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
    depends_on: [api]
    ports: ["3000:8080"]

  # Cloud Scheduler stand-ins: the same jobs on the same cadence as infra/ (poller */10, discovery
  # hourly, crawler and nightly daily). `seed` is the first discovery run, so a fresh `up` fills
  # itself through the real pipeline; nothing is hand-seeded.
  seed:
    build: { context: ., dockerfile: services/discovery/Dockerfile }
    environment: { <<: *env, GKG_FILES: "96" }  # the last 24 hours of GDELT
    depends_on: *deps
    restart: "no"
  discovery:
    <<: *job
    build: { context: ., dockerfile: services/discovery/Dockerfile }
    environment: { <<: *env, DELAY: "3600", EVERY: "3600", JOB: "python -m services.discovery.main" }
  poller:
    <<: *job
    build: { context: ., dockerfile: services/poller/Dockerfile }
    environment: { <<: *env, DELAY: "0", EVERY: "600", JOB: "python -m services.poller.main" }
  crawler:
    <<: *job
    build: { context: ., dockerfile: services/crawler/Dockerfile }
    environment: { <<: *env, DELAY: "0", EVERY: "86400", JOB: "python -m services.crawler.main" }
  pipeline:
    <<: *job
    build: { context: ., dockerfile: pipeline/Dockerfile }
    # first nightly run waits 30 min so the first poll has been extracted and grouped
    environment: { <<: *env, DELAY: "1800", EVERY: "86400", JOB: "python -m pipeline.run" }

volumes:
  neo4j:
