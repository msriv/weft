name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      neo4j:  # tests and evals run against a real, throwaway Neo4j
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/weft-test-pw
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p weft-test-pw 'RETURN 1'"
          --health-interval 5s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: weft-test-pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m weft_core.sources
      - run: uv run python -m evals.gate
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Known-accepted advisories live in .audit-allow (one id per line, with a reason comment).
      - run: uv sync --python 3.12
      - run: uvx pip-audit --disable-pip --no-deps -r <(uv export --no-hashes --no-emit-project) $(sed -e 's/#.*//' -e '/^\s*$/d' -e 's/^/--ignore-vuln /' .audit-allow | tr '\n' ' ')
        shell: bash
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: web

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
