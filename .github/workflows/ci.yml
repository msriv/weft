name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      neo4j:  # tests and evals run against a real, throwaway Neo4j
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/weft-test-pw
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p weft-test-pw 'RETURN 1'"
          --health-interval 5s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: weft-test-pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m weft_core.sources
      - run: uv run python -m evals.gate
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Known-accepted advisories live in .audit-allow (one id per line, with a reason comment).
      - run: uv sync --python 3.12
      - run: uvx pip-audit --disable-pip --no-deps -r <(uv export --no-hashes --no-emit-project) $(sed -e 's/#.*//' -e '/^\s*$/d' -e 's/^/--ignore-vuln /' .audit-allow | tr '\n' ' ')
        shell: bash
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: web

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
